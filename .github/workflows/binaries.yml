name: Binaries

# Builds benchwork-000, benchwork-020 and benchwork-040 with a pinned
# m68k-amigaos-gcc release and uploads them as one artifact. The compiler
# version is part of what a benchmark binary measures, so it is fixed here
# rather than taken from whatever is current; bump it deliberately.
on:
  workflow_call:

env:
  TOOLCHAIN: 16.2-rc13

jobs:
  binaries:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # git describe needs the tags for the version banner
          fetch-depth: 0

      - name: Cache the toolchain
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/m68k-amigaos-gcc-16.2
          key: m68k-amigaos-gcc-${{ env.TOOLCHAIN }}-x86_64-linux

      - name: Download the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v$TOOLCHAIN" -R AmigaPorts/m68k-amigaos-gcc \
            -p "m68k-amigaos-gcc-$TOOLCHAIN-x86_64-linux.tar.xz"
          tar -xJf m68k-amigaos-gcc-*.tar.xz -C "$HOME"
          rm m68k-amigaos-gcc-*.tar.xz

      - name: Build the release binaries
        run: |
          export PATH="$HOME/m68k-amigaos-gcc-16.2/bin:$PATH"
          m68k-amigaos-gcc --version | head -1
          make -j "$(nproc)" release

      - name: Upload the binaries
        uses: actions/upload-artifact@v7
        with:
          name: benchwork
          path: benchwork-0*
